name: release

# 推送 v* tag 自动打包 VSIX 并挂到 GitHub Release 产物。
# 插件零编译面（纯 JS＋JSON 贡献面），打包即校验；语言实现恒在
# taixu 工具链侧（同引擎红线——插件端零语言实现副本）。
#
# 用法：git tag v0.0.3 && git push origin v0.0.3
# 产物：dist/taixu-vscode-<version>.vsix → GitHub Release 附件
#
# 前置（一次性，仓库 Settings → Secrets → Actions）：
#   VSCE_PAT —— Azure DevOps Personal Access Token（Marketplace 发布用，
#               仅 `--packagePath` 打包不需要；发布 Marketplace 时必需）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 Release 与上传产物所需

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 版本一致性断言（tag ↔ package.json）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 版本 $PKG 不一致——先升版再打 tag"
            exit 1
          fi

      - name: 打包 VSIX（npx vsce）
        run: npx --yes @vscode/vsce@latest package --no-dependencies --out "dist/taixu-vscode-${GITHUB_REF_NAME#v}.vsix"

      - name: 上传构建产物（workflow artifact）
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix

      - name: 创建 GitHub Release 并挂 VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 可选：发布到 VS Code Marketplace（需在仓库 Secrets 配置 VSCE_PAT）。
      # 配置后取消注释即可随 tag 一并发布：
      # - name: 发布 Marketplace
      #   run: npx --yes @vscode/vsce@latest publish --no-dependencies
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
